# Produkcija na ovom stroju: lakehouse-edge → atlas-edge:3000
# https://zg-atlas.lakehouse.hr
#
# Samostalni host (vlastiti TLS): vidi Caddyfile i profil `caddy`.
#   docker compose -f docker-compose.prod.yml --profile caddy --env-file .env.prod up -d --build
name: atlas

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - atlas_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build: ./web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:-atlas}@db:5432/atlas
      JAVNI_URL: ${JAVNI_URL:-https://zg-atlas.lakehouse.hr}
      PGPOOL_MAX: "10"
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      lakehouse-edge-net:
        aliases:
          - atlas-edge

  # Jednokratni / ručni ingest:
  #   docker compose -f docker-compose.prod.yml run --rm ingest python sync.py --nastavi
  ingest:
    build: ./ingest
    user: "${INGEST_UID:-1000}:${INGEST_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:-atlas}@db:5432/atlas
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - sync

  cron:
    build: ./ingest
    restart: unless-stopped
    user: "${INGEST_UID:-1000}:${INGEST_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:-atlas}@db:5432/atlas
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c 'while true; do
        python sync.py --nastavi --skupovi prometnice || true;
        if [ "$$(date +%H)" = "05" ]; then python sync.py --nastavi --skupovi prostori_ms || true; fi;
        if [ "$$(date +%d)" = "01" ] && [ "$$(date +%H)" = "03" ]; then python sync.py --nastavi --skupovi javni_zdenci tema:mobilnost || true; fi;
        if [ "$$(date +%d)" = "02" ] && [ "$$(date +%H)" = "03" ]; then python sync.py --nastavi --skupovi isge || true; fi;
        if [ "$$(date +%u)" = "1" ] && [ "$$(date +%H)" = "04" ]; then python sync.py --nastavi --skupovi vrtici privatni_vrtici gtfs_rute || true; fi;
        if [ "$$(date +%u)" = "1" ] && [ "$$(date +%H)" = "06" ]; then python sync.py --nastavi --samo-meta || true; fi;
        sleep 3600;
      done'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMENA: ${DOMENA:-zg-atlas.lakehouse.hr}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    profiles:
      - caddy

volumes:
  atlas_pg:
  caddy_data:
  caddy_config:

networks:
  default:
  lakehouse-edge-net:
    external: true
