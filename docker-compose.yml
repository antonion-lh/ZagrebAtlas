# Lokalni razvoj Atlasa. Portovi namjerno nisu isti kao Radar (5433/3100).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - atlas_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    build: ./ingest
    user: "${INGEST_UID:-1000}:${INGEST_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./ingest:/app
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - sync

  # Periodično osvježavanje (skica; u produkciji zamijeniti systemd timerom ili crontabom).
  # Dnevno: prometnice + prostori MS. Tjedno: vrtići. Ostalo ručno (Geoportal snimke se rijetko mijenjaju).
  cron:
    build: ./ingest
    user: "${INGEST_UID:-1000}:${INGEST_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./ingest:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c 'while true; do
        python sync.py --nastavi --skupovi prometnice || true;
          if [ "$$(date +%H)" = "05" ]; then python sync.py --nastavi --skupovi prostori_ms || true; fi;
          if [ "$$(date +%d)" = "01" ] && [ "$$(date +%H)" = "03" ]; then python sync.py --nastavi --skupovi javni_zdenci tema:mobilnost || true; fi;
          if [ "$$(date +%d)" = "02" ] && [ "$$(date +%H)" = "03" ]; then python sync.py --nastavi --skupovi isge || true; fi;
        if [ "$$(date +%u)" = "1" ] && [ "$$(date +%H)" = "04" ]; then python sync.py --nastavi --skupovi vrtici privatni_vrtici || true; fi;
        sleep 3600;
      done'
    profiles:
      - cron

  web:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      DATABASE_URL: postgresql://atlas:atlas@db:5432/atlas
      JAVNI_URL: http://127.0.0.1:3200
    ports:
      - "3200:3000"
    volumes:
      - ./web:/app
      - atlas_web_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  atlas_pg:
  atlas_web_node_modules:
